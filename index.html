<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>weng.ae</title>
  <meta name="description" content="weng.ae — Blender MMD Animator & AE Editor.">
  <meta name="theme-color" content="#55adff">
  <meta property="og:title" content="weng.ae">
  <meta property="og:description" content="Blender MMD Animator & AE Editor.">
  <meta property="og:image" content="https://wengae.wordpress.com/wp-content/uploads/2023/08/4096-pfp-original-colored-background-1.png?w=600">
  <link rel="icon" href="https://wengae.wordpress.com/wp-content/uploads/2023/08/4096-pfp-original-colored-background-1.png?w=64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #55adff;
      --pink: #f5c3ff;
      --ink: #0f1b33;
      --ink-soft: #4a5672;
      --ease: cubic-bezier(.2,.8,.2,1);
      --spring: cubic-bezier(.34,1.56,.64,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    html { overflow-x: hidden; }

    body {
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--ink);
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= liquid background ================= */
    .liquid {
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      filter: blur(48px);
    }
    .liquid i {
      position: absolute;
      display: block;
      opacity: 0.6;
      will-change: transform, border-radius;
    }
    .liquid .l1 { width: 62vmax; height: 62vmax; left: -10%; top: -12%; background: var(--blue);
      animation: morph 14s ease-in-out infinite, flow1 22s ease-in-out infinite alternate; }
    .liquid .l2 { width: 58vmax; height: 58vmax; right: -12%; bottom: -14%; background: var(--pink);
      animation: morph 17s ease-in-out -4s infinite, flow2 26s ease-in-out infinite alternate; }
    .liquid .l3 { width: 40vmax; height: 40vmax; left: 40%; top: 30%; background: var(--pink); opacity: 0.55;
      animation: morph 12s ease-in-out -7s infinite, flow3 18s ease-in-out infinite alternate; }
    .liquid .l4 { width: 34vmax; height: 34vmax; left: 5%; bottom: 0; background: var(--blue); opacity: 0.4;
      animation: morph 16s ease-in-out -2s infinite, flow2 20s ease-in-out -6s infinite alternate-reverse; }

    @keyframes morph {
      0%, 100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
      25%      { border-radius: 63% 37% 45% 55% / 55% 62% 38% 45%; }
      50%      { border-radius: 38% 62% 33% 67% / 64% 35% 65% 36%; }
      75%      { border-radius: 56% 44% 70% 30% / 38% 58% 42% 62%; }
    }
    @keyframes flow1 { to { transform: translate(18vmax, 12vmax) rotate(120deg) scale(1.1); } }
    @keyframes flow2 { to { transform: translate(-16vmax, -10vmax) rotate(-90deg) scale(0.92); } }
    @keyframes flow3 { to { transform: translate(-22vmax, 14vmax) rotate(160deg) scale(1.2); } }

    /* ================= card ================= */
    .stage { width: 100%; max-width: 400px; }
    .card {
      position: relative;
      border-radius: 28px;
      padding: 20px 16px 16px;
      background: rgba(255, 255, 255, 0.82);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 1px 2px rgba(15, 27, 51, 0.04), 0 30px 60px -30px rgba(85, 173, 255, 0.5);
    }

    /* ================= profile header ================= */
    .head {
      display: grid;
      grid-template-columns: 76px 1fr;
      align-items: center;
      gap: 14px;
      padding: 0 4px;
    }
    .avatar-wrap {
      position: relative;
      width: 76px;
      height: 76px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: zoom-in;
      -webkit-tap-highlight-color: transparent;
      transition: scale 0.2s var(--spring);
      animation: pop 0.8s var(--spring) both, float 5s ease-in-out 0.9s infinite;
    }
    @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    .avatar-wrap::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--blue), var(--pink), var(--blue));
      animation: spin 6s linear infinite;
    }
    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid #fff;
      object-fit: cover;
      display: block;
      color: transparent;
      font-size: 0;
      background: var(--pink);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 50% { translate: 0 -4px; } }

    .who { min-width: 0; text-align: left; }
    .name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: none;
      font: inherit;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.15;
      color: var(--ink);
      text-shadow: 0 2px 0 var(--pink);
      cursor: pointer;
      border-radius: 10px;
      padding: 0 4px;
      margin-left: -4px;
      transition: background-color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .name .copy-hint {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: var(--blue);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.7;
    }
    @media (hover: hover) { .name:hover { background: rgba(85, 173, 255, 0.1); } }
    .name:active { transform: scale(0.96); }
    .name:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .name.copied { background: var(--pink); }

    .role {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 9px;
      border-radius: 100px;
      background: rgba(85, 173, 255, 0.12);
      font-size: clamp(10.5px, 2.85vw, 12px);
      font-weight: 800;
      white-space: nowrap;
      color: var(--ink);
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px 10px;
      margin: 14px 4px 0;
      padding-top: 12px;
      border-top: 1px solid rgba(15, 27, 51, 0.06);
    }
    .bio { font-size: 13px; font-weight: 700; color: var(--ink); }
    .bio .star { color: var(--blue); }

    .email {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 1px dashed var(--pink);
      border-radius: 100px;
      background: #fff;
      font: inherit;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
      --ripple-c: rgba(245, 195, 255, 0.6);
      transition: transform 0.2s var(--spring), background 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) { .email:hover { background: rgba(245, 195, 255, 0.35); } }
    .email.is-pressed { transform: scale(0.95); transition-duration: 0.08s; }
    .email.copied { background: var(--pink); }

    /* ================= link rows ================= */
    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      text-align: left;
    }
    .link {
      --bg: #ffffff;
      --tile: rgba(85, 173, 255, 0.14);
      --tile-ink: var(--blue);
      --go: rgba(85, 173, 255, 0.08);
      --go-ink: var(--ink-soft);
      --hover-ring: rgba(85, 173, 255, 0.45);
      --ripple-c: rgba(85, 173, 255, 0.18);
      position: relative;
      display: grid;
      grid-template-columns: 36px 1fr 28px;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 8px 10px 8px 9px;
      border-radius: 17px;
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(15, 27, 51, 0.07);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    .links li:nth-child(odd) .link:not(.primary):not(.accent) { --tile: rgba(245, 195, 255, 0.5); --tile-ink: var(--ink); }

    .ico {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--tile);
      color: var(--tile-ink);
      transition: transform 0.35s var(--spring);
    }
    .ico svg { width: 19px; height: 19px; fill: currentColor; }

    .txt { position: relative; z-index: 1; display: flex; flex-direction: column; min-width: 0; }
    .txt .label { font-size: 14.5px; font-weight: 800; line-height: 1.2; }
    .txt .sub { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.3; }

    .go {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--go);
      color: var(--go-ink);
      transition: background-color 0.25s, color 0.25s, transform 0.35s var(--spring);
    }
    .go svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    @media (hover: hover) {
      .link:hover { transform: translateY(-2px); border-color: var(--hover-ring); box-shadow: 0 12px 24px -16px rgba(85, 173, 255, 0.8); }
      .link:hover .ico { transform: scale(1.08) rotate(-6deg); }
      .link:hover .go { background: var(--blue); color: #fff; transform: translateX(2px); }
    }
    .link:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    .link.is-pressed { transform: scale(0.975); transition-duration: 0.08s; border-color: var(--hover-ring); }
    .link.is-pressed .ico { transform: scale(0.9); }
    .link.is-pressed .go { background: var(--blue); color: #fff; transform: translateX(4px); }
    .link.bounce { animation: bounce 0.45s var(--spring); }
    @keyframes bounce { 0% { transform: scale(0.975); } 50% { transform: scale(1.015); } 100% { transform: none; } }

    .ripple {
      position: absolute;
      z-index: 0;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      background: var(--ripple-c);
      pointer-events: none;
      animation: ripple 0.7s var(--ease) forwards;
    }
    @keyframes ripple { from { transform: scale(0); opacity: 1; } to { transform: scale(var(--s, 40)); opacity: 0; } }

    .link.primary {
      --tile: rgba(255, 255, 255, 0.35);
      --tile-ink: var(--ink);
      --go: rgba(255, 255, 255, 0.55);
      --go-ink: var(--ink);
      --hover-ring: transparent;
      --ripple-c: rgba(255, 255, 255, 0.45);
      background: var(--blue);
      border-color: transparent;
      box-shadow: 0 10px 22px -14px rgba(85, 173, 255, 0.9);
    }
    .link.primary .sub { color: var(--ink); opacity: 0.75; }
    @media (hover: hover) { .link.primary:hover .go { background: #fff; color: var(--blue); } }
    .link.primary.is-pressed .go { background: #fff; color: var(--blue); }

    .link.accent {
      --tile: rgba(255, 255, 255, 0.55);
      --tile-ink: var(--ink);
      --go: rgba(255, 255, 255, 0.65);
      --go-ink: var(--ink);
      --hover-ring: transparent;
      --ripple-c: rgba(255, 255, 255, 0.55);
      background: var(--pink);
      border-color: transparent;
      box-shadow: 0 10px 22px -14px rgba(245, 195, 255, 1);
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-soft);
      letter-spacing: 0.03em;
    }
    .footer .heart { color: var(--blue); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translate(-50%, 20px) scale(0.9);
      padding: 10px 18px;
      border-radius: 100px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 10px 24px -8px rgba(15, 27, 51, 0.5);
      transition: opacity 0.3s, transform 0.4s var(--spring);
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }


    .avatar-wrap:active { scale: 0.94; }
    .avatar-wrap:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    @media (hover: hover) { .avatar-wrap:hover { scale: 1.05; } }

    /* ================= card viewer ================= */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      visibility: hidden;
      pointer-events: none;
    }
    .viewer.open { visibility: visible; pointer-events: auto; }
    .viewer-bg {
      position: absolute;
      inset: 0;
      background: rgba(15, 27, 51, 0.45);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }
    .viewer.open .viewer-bg { opacity: 1; }

    .tc-stage {
      position: relative;
      perspective: 900px;
      opacity: 0;
      transform: scale(0.5) translateY(40px);
      transition: opacity 0.3s var(--ease), transform 0.55s var(--spring);
    }
    .viewer.open .tc-stage { opacity: 1; transform: none; }

    .tcard {
      --crx: 0deg;
      --cry: 0deg;
      --mx: 50%;
      --my: 50%;
      --holo: 0;
      position: relative;
      width: min(72vw, 320px, calc(100dvh - 180px));
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 8px;
      background: conic-gradient(from 200deg, var(--blue), var(--pink), var(--blue), var(--pink), var(--blue));
      transform: rotateX(var(--crx)) rotateY(var(--cry));
      transform-style: preserve-3d;
      --sx: 0px;
      --sy: 24px;
      box-shadow: var(--sx) var(--sy) 50px -16px rgba(15, 27, 51, 0.55);
      touch-action: none;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      will-change: transform;
    }
    .tcard.dragging { cursor: grabbing; }
    .tcard.settle { transition: transform 0.7s var(--spring), box-shadow 0.7s var(--ease); }
    .tcard.intro { animation: intro 1.1s var(--ease); }
    @keyframes intro {
      0%   { transform: rotateY(-200deg); }
      100% { transform: rotateY(0deg); }
    }

    .tc-art {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--pink);
      border: 4px solid #fff;
    }
    .tc-art img { width: 100%; height: 100%; object-fit: cover; display: block; color: transparent; font-size: 0; }

    /* holo foil + glare */
    .tc-holo, .tc-glare {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }
    /* glossy sheen: one soft band of light that sweeps across as it turns */
    .tc-holo {
      background: linear-gradient(115deg,
        rgba(255, 255, 255, 0) 36%,
        rgba(85, 173, 255, 0.45) 44%,
        rgba(255, 255, 255, 0.95) 50%,
        rgba(245, 195, 255, 0.5) 56%,
        rgba(255, 255, 255, 0) 64%);
      background-size: 260% 260%;
      background-position: var(--mx) var(--my);
      mix-blend-mode: screen;
      opacity: calc(var(--holo) * 0.85);
    }
    /* soft specular spot where the light hits */
    .tc-glare {
      background: radial-gradient(circle at var(--mx) var(--my),
        rgba(255, 255, 255, 0.6) 0%,
        rgba(255, 255, 255, 0.15) 28%,
        rgba(255, 255, 255, 0) 55%);
      mix-blend-mode: soft-light;
      opacity: var(--holo);
    }

    .viewer-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(22px, env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s 0.3s;
    }
    .viewer.open .viewer-hint { opacity: 0.85; }
    .viewer-close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .viewer-close:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    body.locked { overflow: hidden; }

    @media (max-height: 620px) {
      .card { padding: 14px 12px 12px; }
      .head { grid-template-columns: 60px 1fr; gap: 12px; }
      .avatar-wrap { width: 60px; height: 60px; }
      .name { font-size: 22px; }
      .contact { margin-top: 10px; padding-top: 8px; }
      .links { gap: 6px; margin-top: 10px; }
      .link { min-height: 46px; padding: 5px 8px 5px 7px; border-radius: 14px; grid-template-columns: 32px 1fr 26px; }
      .ico { width: 32px; height: 32px; border-radius: 10px; }
      .txt .sub { font-size: 11px; }
      .footer { margin-top: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

        var r = el.getBoundingClientRect();
        var dot = document.createElement('span');
        dot.className = 'ripple';
        dot.style.left = (e.clientX - r.left) + 'px';
        dot.style.top = (e.clientY - r.top) + 'px';
        dot.style.setProperty('--s', Math.ceil(Math.hypot(r.width, r.height) / 5));
        el.appendChild(dot);
        dot.addEventListener('animationend', function () { dot.remove(); });
      }
      function up(e) {
        var el = e.currentTarget;
        if (!el.classList.contains('is-pressed')) return;
        el.classList.remove('is-pressed');
        if (REDUCE) return;
        void el.offsetWidth;
        el.classList.add('bounce');
      }
      function cancel(e) {
        var el = e.currentTarget, r = el.getBoundingClientRect();
        if (e.type === 'pointerleave' && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) return;
        el.classList.remove('is-pressed');
      }
      for (var i = 0; i < els.length; i++) {
        els[i].addEventListener('pointerdown', down);
        els[i].addEventListener('pointerup', up);
        els[i].addEventListener('pointerleave', cancel);
        els[i].addEventListener('pointercancel', cancel);
        els[i].addEventListener('animationend', function (e) {
          if (e.animationName === 'bounce') e.currentTarget.classList.remove('bounce');
        });
      }
    })();

    // ---------- Profile card viewer (tap the profile picture) ----------
    (function () {
      var viewer = document.getElementById('viewer');
      var card = document.getElementById('tcard');
      var opener = document.getElementById('avatarBtn');
      var closeBtn = viewer.querySelector('.viewer-close');
      var MAX = 22; // max rotation (deg)
      var dragging = false, sx = 0, sy = 0, rx = 0, ry = 0, pid = null;

      function setPose(x, y, holo) {
        // x, y in -1..1
        card.style.setProperty('--cry', (x * MAX).toFixed(2) + 'deg');
        card.style.setProperty('--crx', (-y * MAX).toFixed(2) + 'deg');
        card.style.setProperty('--mx', (50 + x * 28).toFixed(1) + '%');
        card.style.setProperty('--my', (50 + y * 28).toFixed(1) + '%');
        card.style.setProperty('--holo', holo.toFixed(2));
        card.style.setProperty('--sx', (-x * 18).toFixed(1) + 'px');
        card.style.setProperty('--sy', (24 + y * 12).toFixed(1) + 'px');
      }
      function rest() {
        card.classList.add('settle');
        setPose(0, 0, 0);
        setTimeout(function () { card.classList.remove('settle'); }, 700);
      }

      function open() {
        viewer.classList.add('open');
        viewer.setAttribute('aria-hidden', 'false');
        document.body.classList.add('locked');
        setPose(0, 0, 0);
        if (!REDUCE) {
          card.classList.remove('intro'); void card.offsetWidth; card.classList.add('intro');
        }
        setTimeout(function () { closeBtn.focus(); }, 50);
      }
      function close() {
        viewer.classList.remove('open');
        viewer.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('locked');
        opener.focus();
      }
      opener.addEventListener('click', open);
      viewer.addEventListener('click', function (e) { if (e.target.hasAttribute('data-close')) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && viewer.classList.contains('open')) close(); });
      card.addEventListener('animationend', function () { card.classList.remove('intro'); });

      if (REDUCE) return;

      // Drag (finger or mouse) to turn the card
      card.addEventListener('pointerdown', function (e) {
        dragging = true; pid = e.pointerId;
        sx = e.clientX; sy = e.clientY;
        card.classList.remove('settle', 'intro');
        card.classList.add('dragging');
        try { card.setPointerCapture(pid); } catch (_) {}
      });
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        if (dragging) {
          rx = Math.max(-1, Math.min(1, (e.clientX - sx) / (r.width * 0.6)));
          ry = Math.max(-1, Math.min(1, (e.clientY - sy) / (r.height * 0.6)));
          setPose(rx, ry, Math.min(1, Math.hypot(rx, ry) * 1.4));
        } else if (e.pointerType === 'mouse') {
          // desktop: hover to look around
          var x = ((e.clientX - r.left) / r.width - 0.5) * 2;
          var y = ((e.clientY - r.top) / r.height - 0.5) * 2;
          setPose(x * 0.7, y * 0.7, Math.min(1, Math.hypot(x, y)));
        }
      });
      function end() {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('dragging');
        rest();
      }
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', end);
      card.addEventListener('pointerleave', function (e) { if (!dragging && e.pointerType === 'mouse') rest(); });
    })();
  </script>
</body>
</html>
