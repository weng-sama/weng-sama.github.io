<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>weng.ae</title>
  <meta name="description" content="weng.ae — Blender MMD Animator & AE Editor.">
  <meta name="theme-color" content="#55adff">
  <meta property="og:title" content="weng.ae">
  <meta property="og:description" content="Blender MMD Animator & AE Editor.">
  <meta property="og:image" content="https://wengae.wordpress.com/wp-content/uploads/2023/08/4096-pfp-original-colored-background-1.png?w=600">
  <link rel="icon" href="https://wengae.wordpress.com/wp-content/uploads/2023/08/4096-pfp-original-colored-background-1.png?w=64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #55adff;
      --blue-deep: #2f8ae6;
      --pink: #f5c3ff;
      --pink-deep: #dc9aec;
      --ink: #0f1b33;
      --ink-soft: #4a5672;
      --radius: 32px;
      --rx: 0deg;
      --ry: 0deg;
      --ease: cubic-bezier(.2,.8,.2,1);
      --spring: cubic-bezier(.34,1.56,.64,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #eaf4ff 0%, #fbf8ff 50%, #fdeeff 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 56px 18px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      perspective: 1200px;
    }

    /* ================= card ================= */
    .stage { width: 100%; max-width: 420px; transform-style: preserve-3d; }
    .card {
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      border-radius: var(--radius);
      padding: 44px 26px 32px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff, #fdfaff);
      box-shadow:
        inset 0 1.5px 0 #fff,
        inset 0 -2px 0 rgba(245, 195, 255, 0.45),
        0 2px 4px rgba(15, 27, 51, 0.04),
        0 18px 30px -10px rgba(85, 173, 255, 0.35),
        0 40px 80px -24px rgba(220, 154, 236, 0.55);
    }
    .card.idle { animation: sway 9s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: rotateX(3deg) rotateY(-4deg); }
      50%      { transform: rotateX(-2deg) rotateY(4deg); }
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(600px circle at var(--gx, 30%) var(--gy, 0%), rgba(255, 255, 255, 0.65), transparent 45%);
      mix-blend-mode: soft-light;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      transform: translateZ(-14px);
      background: linear-gradient(180deg, var(--blue), var(--pink));
      opacity: 0.35;
      filter: blur(1px);
      pointer-events: none;
    }
    .layer { transform-style: preserve-3d; }
    .z1 { transform: translateZ(18px); }
    .z2 { transform: translateZ(32px); }
    .z3 { transform: translateZ(52px); }

    /* ================= avatar ================= */
    .avatar-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 18px;
      opacity: 0;
      animation: pop 0.8s var(--spring) 0.05s forwards, float 5s ease-in-out 0.9s infinite;
    }
    @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    .avatar-wrap::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(var(--blue), var(--pink), #fff, var(--blue));
      animation: spin 6s linear infinite;
      box-shadow: 0 16px 28px -10px rgba(47, 138, 230, 0.6);
    }
    .avatar-wrap::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: -22px;
      height: 12px;
      border-radius: 50%;
      background: rgba(15, 27, 51, 0.14);
      filter: blur(6px);
      animation: shadowPulse 5s ease-in-out infinite;
    }
    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
      display: block;
      color: transparent;
      font-size: 0;
      background: radial-gradient(circle at 35% 30%, #fff 0%, var(--pink) 45%, var(--pink-deep) 100%);
      box-shadow: inset 0 -6px 14px rgba(15, 27, 51, 0.12);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 50% { translate: 0 -8px; } }
    @keyframes shadowPulse { 50% { transform: scaleX(0.8); opacity: 0.6; } }

    /* ================= text animation ================= */
    h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.01em;
      color: var(--ink);
      perspective: 400px;
      cursor: default;
      text-shadow:
        0 1px 0 #fff,
        0 2px 0 rgba(245, 195, 255, 0.9),
        0 3px 0 rgba(85, 173, 255, 0.55),
        0 10px 18px rgba(85, 173, 255, 0.35);
    }
    .char {
      display: inline-block;
      opacity: 0;
      transform-origin: 50% 100%;
      animation: charIn 0.7s var(--spring) forwards;
      animation-delay: calc(0.35s + var(--c) * 0.06s);
    }
    @keyframes charIn {
      0%   { opacity: 0; transform: translateY(26px) rotateX(-90deg); filter: blur(4px); }
      100% { opacity: 1; transform: none; filter: blur(0); }
    }
    h1.wave .char { animation: wave 0.9s var(--ease) both; animation-delay: calc(var(--c) * 0.06s); opacity: 1; }
    @keyframes wave {
      0%, 100% { transform: none; color: var(--ink); }
      40%      { transform: translateY(-7px) scale(1.08); color: var(--blue-deep); }
    }

    .role {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      margin-top: 12px;
      padding: 7px 16px;
      border-radius: 100px;
      background: linear-gradient(180deg, #ffffff, #f4f0ff);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--ink);
      box-shadow:
        inset 0 1px 0 #fff,
        0 3px 0 var(--pink),
        0 8px 16px -6px rgba(85, 173, 255, 0.45);
      opacity: 0;
      animation: fadeUp 0.6s var(--ease) 0.75s forwards;
    }
    .role .caret {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      margin-left: 2px;
      border-radius: 2px;
      background: var(--blue);
      animation: blink 0.8s steps(1) infinite;
    }
    .role .caret.done { animation: blink 0.8s steps(1) 3, fadeOut 0.3s 2.4s forwards; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; width: 0; margin: 0; } }

    .divider {
      width: 0;
      height: 5px;
      border-radius: 5px;
      margin: 20px auto 16px;
      background: linear-gradient(90deg, var(--blue), var(--pink));
      box-shadow: 0 3px 8px rgba(85, 173, 255, 0.4);
      animation: grow 0.7s var(--ease) 1.1s forwards;
    }
    @keyframes grow { to { width: 48px; } }

    .bio {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.8;
      color: var(--ink);
      opacity: 0;
      animation: fadeUp 0.6s var(--ease) 1.25s forwards;
    }
    .bio .star {
      display: inline-block;
      color: var(--blue);
      text-shadow: 0 2px 4px rgba(85, 173, 255, 0.5);
      animation: twirl 3.2s ease-in-out infinite;
    }
    @keyframes twirl {
      0%, 100% { transform: rotate(0) scale(1); }
      50% { transform: rotate(180deg) scale(1.25); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); filter: blur(3px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    /* ================= email chip ================= */
    .email {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 8px 16px;
      border: 0;
      border-radius: 100px;
      background: linear-gradient(180deg, #fff, #fdf3ff);
      font: inherit;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
      opacity: 0;
      animation: fadeUp 0.6s var(--ease) 1.4s forwards;
      box-shadow: inset 0 1px 0 #fff, 0 3px 0 var(--pink-deep), 0 8px 14px -6px rgba(220, 154, 236, 0.8);
      transition: transform 0.2s var(--spring), box-shadow 0.2s, background 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      .email:hover { transform: translateY(-2px) scale(1.03); box-shadow: inset 0 1px 0 #fff, 0 5px 0 var(--pink-deep), 0 14px 20px -6px rgba(220, 154, 236, 0.9); }
    }
    .email.is-pressed { transform: translateY(3px) scale(0.96); box-shadow: inset 0 1px 0 #fff, 0 0 0 var(--pink-deep), 0 3px 6px -3px rgba(220, 154, 236, 0.8); transition-duration: 0.08s; }
    .email.copied { background: linear-gradient(180deg, #fbdcff, var(--pink)); }
    .email .ripple { --ripple-c: rgba(85, 173, 255, 0.35); }

    /* ================= 3D buttons ================= */
    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 28px;
    }
    .links li {
      opacity: 0;
      transform: translateY(18px) rotateX(-40deg);
      transform-origin: 50% 100%;
      animation: rise 0.7s var(--ease) forwards;
      animation-delay: calc(1.45s + var(--i) * 0.08s);
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .btn {
      --face: #ffffff;
      --face2: #fbf7ff;
      --edge: var(--pink);
      --glow: rgba(220, 154, 236, 0.55);
      --ripple-c: rgba(85, 173, 255, 0.3);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      min-height: 56px;
      padding: 12px 44px;
      border-radius: 100px;
      background: linear-gradient(180deg, var(--face), var(--face2));
      color: var(--ink);
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      isolation: isolate;
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 -2px 0 rgba(15, 27, 51, 0.04),
        0 5px 0 var(--edge),
        0 14px 22px -10px var(--glow);
      transition: transform 0.25s var(--spring), box-shadow 0.25s var(--ease), letter-spacing 0.3s var(--ease);
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn .label, .btn small { position: relative; z-index: 2; transition: transform 0.3s var(--spring); }

    .btn .arrow {
      position: absolute;
      right: 20px;
      top: 50%;
      z-index: 2;
      font-size: 16px;
      line-height: 1;
      opacity: 0;
      transform: translate(-10px, -50%);
      transition: opacity 0.25s, transform 0.35s var(--spring);
    }
    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      left: -60%;
      z-index: 1;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.9), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s var(--ease);
    }
    .btn::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 4px;
      height: 40%;
      border-radius: 100px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), transparent);
      pointer-events: none;
      z-index: 1;
    }

    @media (hover: hover) {
      .btn:hover {
        transform: translateY(-4px) scale(1.02);
        letter-spacing: 0.12em;
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
          inset 0 -2px 0 rgba(15, 27, 51, 0.04),
          0 9px 0 var(--edge),
          0 24px 30px -12px var(--glow),
          0 0 0 4px rgba(85, 173, 255, 0.18);
      }
      .btn:hover::before { left: 120%; }
      .btn:hover .arrow { opacity: 1; transform: translate(0, -50%); }
    }
    .btn:focus-visible {
      outline: none;
      transform: translateY(-4px);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        0 9px 0 var(--edge),
        0 0 0 4px var(--blue);
    }
    .btn:focus-visible .arrow { opacity: 1; transform: translate(0, -50%); }

    /* pressed: squish down onto the edge */
    .btn.is-pressed {
      transform: translateY(5px) scale(0.97, 0.94);
      transition-duration: 0.08s;
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 4px 10px rgba(15, 27, 51, 0.12),
        0 0 0 var(--edge),
        0 3px 6px -3px var(--glow);
    }
    .btn.is-pressed .label { transform: scale(0.95); }
    .btn.is-pressed::before { left: 120%; }
    .btn.is-pressed .arrow { opacity: 1; transform: translate(0, -50%); }
    /* release: springy bounce */
    .btn.bounce { animation: bounce 0.5s var(--spring); }
    @keyframes bounce {
      0%   { transform: translateY(5px) scale(0.97, 0.94); }
      45%  { transform: translateY(-6px) scale(1.04, 1.06); }
      100% { transform: none; }
    }

    /* ripple from tap point */
    .ripple {
      position: absolute;
      z-index: 0;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      background: var(--ripple-c);
      pointer-events: none;
      animation: ripple 0.7s var(--ease) forwards;
    }
    @keyframes ripple {
      from { transform: scale(0); opacity: 1; }
      to   { transform: scale(var(--s, 40)); opacity: 0; }
    }

    .btn small {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--ink-soft);
    }
    .btn.primary {
      --face: #7cc0ff;
      --face2: var(--blue);
      --edge: var(--blue-deep);
      --glow: rgba(47, 138, 230, 0.6);
      --ripple-c: rgba(255, 255, 255, 0.6);
    }
    .btn.primary small { color: var(--ink); opacity: 0.8; }
    .btn.accent {
      --face: #fbdcff;
      --face2: var(--pink);
      --edge: var(--pink-deep);
      --glow: rgba(220, 154, 236, 0.75);
      --ripple-c: rgba(255, 255, 255, 0.7);
    }

    .footer {
      margin-top: 28px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeUp 0.6s var(--ease) 2.1s forwards;
    }
    .footer .heart {
      display: inline-block;
      color: var(--blue);
      text-shadow: 0 2px 4px rgba(85, 173, 255, 0.5);
      animation: beat 1.6s ease-in-out infinite;
    }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } }

    /* iPhone: one-tap switch for the motion sensor */
    .tilt-btn {
      display: none;
      margin: 14px auto 0;
      padding: 6px 14px;
      border: 0;
      border-radius: 100px;
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--blue-deep);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tilt-btn.show { display: inline-block; animation: fadeUp 0.6s var(--ease) 2.3s both; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px) scale(0.9);
      padding: 10px 18px;
      border-radius: 100px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 10px 24px -8px rgba(15, 27, 51, 0.5);
      transition: opacity 0.3s, transform 0.4s var(--spring);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .links li, .char, .role, .bio, .email, .footer, .avatar-wrap { opacity: 1 !important; transform: none !important; filter: none !important; }
      .divider { width: 48px; }
      .card { transform: none !important; }
    }
  </style>
</head>
<body>

               alt="weng.ae 頭像" width="116" height="116">
        </div>
      </div>

      <div class="layer z2">
        <h1 id="name" aria-label="weng.ae">weng.ae</h1>
        <p class="role" id="role" data-text="Blender MMD Animator &amp; AE Editor">Blender MMD Animator &amp; AE Editor</p>
      </div>

      <div class="layer z1">
        <div class="divider"></div>

      </div>

      <ul class="links layer z2">
        <li style="--i:0"><a class="btn press primary" href="https://discord.gg/eZ4nu9p7uf" target="_blank" rel="noopener"><span class="label">My Discord Server</span><small>MMD method &amp; clips here</small><span class="arrow" aria-hidden="true">→</span></a></li>

        <li style="--i:2"><a class="btn press" href="https://www.instagram.com/weng.ae/" target="_blank" rel="noopener"><span class="label">Instagram</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li style="--i:3"><a class="btn press" href="https://www.youtube.com/@weng_ae" target="_blank" rel="noopener"><span class="label">YouTube</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li style="--i:4"><a class="btn press" href="https://www.xiaohongshu.com/user/profile/678a5896000000000a03c1b5?xsec_token=YBOfYJW9eGZq3EeUHEMXmOVinDvXA7-aT3nq_WoQU8aes%3D&amp;xsec_source=app_share&amp;xhsshare=CopyLink&amp;appuid=678a5896000000000a03c1b5&amp;apptime=1737261810&amp;share_id=fcdfd63a57bb416c96ebe9c9e3688378&amp;fbclid=IwY2xjawH5YndleHRuA2FlbQIxMAABHbKSFvpmj3icfEUgRgMRoQpXpdh6coWYeoYbcs4CxeJiqBeHSXmw4d7nAA_aem_VBD0kKJmUGlRMHdP262HaA" target="_blank" rel="noopener"><span class="label">Rednote</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li style="--i:5"><a class="btn press" href="https://www.threads.net/@weng.ae" target="_blank" rel="noopener"><span class="label">Threads</span><span class="arrow" aria-hidden="true">→</span></a></li>

      <button class="tilt-btn" id="tiltBtn" type="button">✦ 開啟傾斜效果</button>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已複製 email ✦</div>

  <script>
    var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var toastEl = document.getElementById('toast');
    var toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
    }

    // ---------- Text animation ----------
    (function () {
      if (REDUCE) return;
      var h1 = document.getElementById('name');
      var text = h1.textContent;
      h1.textContent = '';
      for (var i = 0; i < text.length; i++) {
        var s = document.createElement('span');
        s.className = 'char';
        s.setAttribute('aria-hidden', 'true');
        s.style.setProperty('--c', i);
        s.textContent = text[i];
        h1.appendChild(s);
      }
      function wave() {
        h1.classList.remove('wave');
        void h1.offsetWidth;
        h1.classList.add('wave');
      }
      setTimeout(function () { wave(); setInterval(wave, 6000); }, 2600);
      h1.addEventListener('mouseenter', wave);
      h1.addEventListener('click', wave);

      // typewriter for the role chip (width locked so layout doesn't jump)
      var role = document.getElementById('role');
      var full = role.getAttribute('data-text');
      role.style.minWidth = role.getBoundingClientRect().width + 'px';
      role.textContent = '';
      role.setAttribute('aria-label', full);
      var out = document.createElement('span');
      out.setAttribute('aria-hidden', 'true');
      var caret = document.createElement('span');
      caret.className = 'caret';
      role.appendChild(out);
      role.appendChild(caret);
      var k = 0;
      setTimeout(function type() {
        out.textContent = full.slice(0, ++k);
        if (k < full.length) setTimeout(type, 28 + Math.random() * 30);
        else caret.classList.add('done');
      }, 900);
    })();

    // ---------- Button feedback: press, ripple, bounce, haptic ----------
    (function () {
      var els = document.querySelectorAll('.press');
      function down(e) {
        var el = e.currentTarget;
        el.classList.remove('bounce');
        el.classList.add('is-pressed');
        if (navigator.vibrate) { try { navigator.vibrate(10); } catch (_) {} }
        if (REDUCE) return;
        var r = el.getBoundingClientRect();
        var dot = document.createElement('span');
        dot.className = 'ripple';
        dot.style.left = (e.clientX - r.left) + 'px';
        dot.style.top = (e.clientY - r.top) + 'px';
        dot.style.setProperty('--s', Math.ceil(Math.hypot(r.width, r.height) / 6));
        el.appendChild(dot);
        dot.addEventListener('animationend', function () { dot.remove(); });
      }
      function up(e) {
        var el = e.currentTarget;
        if (!el.classList.contains('is-pressed')) return;
        el.classList.remove('is-pressed');
        if (REDUCE) return;
        void el.offsetWidth;
        el.classList.add('bounce');
      }
      function cancel(e) { e.currentTarget.classList.remove('is-pressed'); }
      for (var i = 0; i < els.length; i++) {
        els[i].addEventListener('pointerdown', down);
        els[i].addEventListener('pointerup', up);
        els[i].addEventListener('pointerleave', cancel);
        els[i].addEventListener('pointercancel', cancel);
        els[i].addEventListener('animationend', function (e) {
          if (e.animationName === 'bounce') e.currentTarget.classList.remove('bounce');
        });
      }
    })();

    // ---------- Card tilt ----------
    // Phone: the card follows how far the phone is tilted (relative to how it was held
    // when the page opened). Computer: follows the mouse. Nothing: gentle idle sway.
    (function () {
      if (REDUCE) return;
      var card = document.getElementById('card');
      var MAX = 14;            // max card tilt in degrees
      var RANGE = 30;          // phone tilt (degrees) that maps to MAX
      var tx = 0, ty = 0, cx = 0, cy = 0;
      var mode = 'idle';       // 'idle' | 'mouse' | 'gyro'
      var base = null, idleTimer;

      function setTarget(x, y, src) {
        tx = Math.max(-1, Math.min(1, x));
        ty = Math.max(-1, Math.min(1, y));
        if (mode !== src) { mode = src; card.classList.remove('idle'); }
        if (src === 'mouse') {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(function () {
            if (mode === 'mouse') { mode = 'idle'; tx = ty = 0; card.classList.add('idle'); }
          }, 4000);
        }
      }

      window.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse' || mode === 'gyro') return;
        setTarget((e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2, 'mouse');
      });

      function screenAngle() {
        if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
        return window.orientation || 0;
      }
      function onOrient(e) {
        if (e.beta == null || e.gamma == null) return;
        var lr, fb, a = screenAngle();
        // left-right and front-back tilt as seen on screen
        if (a === 90)       { lr = e.beta;   fb = -e.gamma; }
        else if (a === -90 || a === 270) { lr = -e.beta; fb = e.gamma; }
        else if (a === 180) { lr = -e.gamma; fb = -e.beta; }
        else                { lr = e.gamma;  fb = e.beta; }
        if (!base) base = { lr: lr, fb: fb };
        setTarget((lr - base.lr) / RANGE, (fb - base.fb) / RANGE, 'gyro');
      }
      window.addEventListener('orientationchange', function () { base = null; });
      if (screen.orientation) screen.orientation.addEventListener('change', function () { base = null; });

      function startGyro() { window.addEventListener('deviceorientation', onOrient); }

      var btn = document.getElementById('tiltBtn');
      var gotGyro = false;
      window.addEventListener('deviceorientation', function once(e) {
        if (e.beta != null) { gotGyro = true; window.removeEventListener('deviceorientation', once); }
      });
      if (window.DeviceOrientationEvent) startGyro();
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iPhone / iPad: motion data needs one tap to allow; show the switch only if no data arrives
        setTimeout(function () { if (!gotGyro && matchMedia('(pointer: coarse)').matches) btn.classList.add('show'); }, 1500);
        btn.addEventListener('click', function () {
          DeviceOrientationEvent.requestPermission().then(function (s) {
            if (s === 'granted') {
              btn.classList.remove('show');
              toast('傾斜效果已開啟 ✦');
            } else {
              toast('未允許動作感應');
            }
          }).catch(function () { toast('無法開啟傾斜效果'); });
        });
      }

      (function loop() {
        cx += (tx - cx) * 0.12;
        cy += (ty - cy) * 0.12;
        if (mode !== 'idle') {
          card.style.setProperty('--ry', (cx * MAX).toFixed(2) + 'deg');
          card.style.setProperty('--rx', (-cy * MAX).toFixed(2) + 'deg');
          card.style.setProperty('--gx', (50 + cx * 40).toFixed(1) + '%');
          card.style.setProperty('--gy', (cy * 40).toFixed(1) + '%');
        }
        requestAnimationFrame(loop);
      })();
    })();

    // ---------- Copy email ----------
    (function () {
      var btn = document.querySelector('.email');
      var t;
      btn.addEventListener('click', function () {
        var email = btn.getAttribute('data-email');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(email).then(function () {
            btn.classList.add('copied');
            clearTimeout(t);
            t = setTimeout(function () { btn.classList.remove('copied'); }, 1800);
            toast('已複製 email ✦');
          }, function () { window.location.href = 'mailto:' + email; });
        } else {
          window.location.href = 'mailto:' + email;
        }
      });
    })();
  </script>
</body>
</html>
