<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>weng.ae</title>
  <meta name="description" content="weng.ae — Blender MMD Animator & AE Editor.">
  <meta name="theme-color" content="#55adff">
  <meta property="og:title" content="weng.ae">
  <meta property="og:description" content="Blender MMD Animator & AE Editor.">
  <meta property="og:image" content="https://wengae.wordpress.com/wp-content/uploads/2023/08/4096-pfp-original-colored-background-1.png?w=600">
  <link rel="icon" href="https://wengae.wordpress.com/wp-content/uploads/2023/08/4096-pfp-original-colored-background-1.png?w=64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #55adff;
      --blue-deep: #2f8ae6;
      --pink: #f5c3ff;
      --pink-deep: #dc9aec;
      --ink: #0f1b33;
      --ink-soft: #4a5672;
      --radius: 32px;
      --rx: 0deg;
      --ry: 0deg;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #eaf4ff 0%, #fbf6ff 55%, #fdeeff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 56px 18px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      perspective: 1200px;
    }

    /* ================= 3D background ================= */
    .scene {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
    }
    .glow.g1 { width: 55vmax; height: 55vmax; background: var(--blue); top: -25vmax; left: -20vmax; animation: drift1 20s ease-in-out infinite alternate; }
    .glow.g2 { width: 50vmax; height: 50vmax; background: var(--pink); bottom: -25vmax; right: -18vmax; animation: drift2 24s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(12vmax, 8vmax); } }
    @keyframes drift2 { to { transform: translate(-10vmax, -8vmax); } }

    /* glossy 3D spheres */
    .orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      animation: bob var(--dur, 7s) ease-in-out infinite alternate;
      transform: translate3d(var(--px, 0px), var(--py, 0px), 0);
    }
    .orb::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: -18%;
      height: 14%;
      border-radius: 50%;
      background: rgba(15, 27, 51, 0.12);
      filter: blur(6px);
    }
    .orb.blue {
      background: radial-gradient(circle at 32% 28%, #ffffff 0%, #bfe0ff 14%, var(--blue) 46%, var(--blue-deep) 100%);
      box-shadow: inset -8px -10px 22px rgba(20, 70, 140, 0.35), 0 18px 40px -12px rgba(47, 138, 230, 0.55);
    }
    .orb.pink {
      background: radial-gradient(circle at 32% 28%, #ffffff 0%, #fde8ff 16%, var(--pink) 48%, var(--pink-deep) 100%);
      box-shadow: inset -8px -10px 22px rgba(150, 70, 170, 0.28), 0 18px 40px -12px rgba(220, 154, 236, 0.7);
    }
    .o1 { width: 120px; height: 120px; top: 8%; left: 6%; --dur: 7s; }
    .o2 { width: 64px; height: 64px; top: 16%; right: 10%; --dur: 6s; }
    .o3 { width: 170px; height: 170px; bottom: 6%; left: -40px; --dur: 9s; }
    .o4 { width: 90px; height: 90px; bottom: 14%; right: 7%; --dur: 8s; }
    .o5 { width: 38px; height: 38px; top: 48%; left: 14%; --dur: 5s; }
    .o6 { width: 46px; height: 46px; top: 58%; right: 16%; --dur: 6.5s; }

    @keyframes bob {
      from { translate: 0 0; }
      to   { translate: 0 -22px; }
    }

    /* ring torus */
    .ring {
      position: absolute;
      width: 140px;
      height: 140px;
      top: 70%;
      left: 72%;
      border-radius: 50%;
      border: 16px solid transparent;
      background:
        linear-gradient(#0000, #0000) padding-box,
        conic-gradient(from 200deg, var(--pink), #fff, var(--blue), var(--blue-deep), var(--pink)) border-box;
      -webkit-mask: radial-gradient(circle, transparent 54px, #000 55px);
              mask: radial-gradient(circle, transparent 54px, #000 55px);
      transform: rotateX(62deg) rotateZ(0deg);
      animation: spinRing 14s linear infinite;
      opacity: 0.85;
      filter: drop-shadow(0 14px 18px rgba(85, 173, 255, 0.35));
    }
    @keyframes spinRing { to { transform: rotateX(62deg) rotateZ(360deg); } }

    /* ================= card ================= */
    .stage {
      width: 100%;
      max-width: 420px;
      transform-style: preserve-3d;
    }
    .card {
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
      border-radius: var(--radius);
      padding: 44px 26px 32px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff, #fdfaff);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 1),
        inset 0 -2px 0 rgba(245, 195, 255, 0.45),
        0 2px 4px rgba(15, 27, 51, 0.04),
        0 18px 30px -10px rgba(85, 173, 255, 0.35),
        0 40px 80px -24px rgba(220, 154, 236, 0.55);
    }
    .card.idle { animation: sway 9s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: rotateX(4deg) rotateY(-5deg); }
      50%      { transform: rotateX(-3deg) rotateY(5deg); }
    }
    /* gloss highlight that follows tilt */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(600px circle at var(--gx, 30%) var(--gy, 0%), rgba(255, 255, 255, 0.65), transparent 45%);
      mix-blend-mode: soft-light;
    }
    /* thickness edge behind the card */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      transform: translateZ(-14px);
      background: linear-gradient(180deg, var(--blue), var(--pink));
      opacity: 0.35;
      filter: blur(1px);
      pointer-events: none;
    }

    .layer { transform-style: preserve-3d; }
    .z1 { transform: translateZ(18px); }
    .z2 { transform: translateZ(32px); }
    .z3 { transform: translateZ(52px); }

    /* avatar */
    .avatar-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 18px;
      animation: float 5s ease-in-out infinite;
    }
    .avatar-wrap::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(var(--blue), var(--pink), #fff, var(--blue));
      animation: spin 6s linear infinite;
      box-shadow: 0 16px 28px -10px rgba(47, 138, 230, 0.6);
    }
    .avatar-wrap::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: -22px;
      height: 12px;
      border-radius: 50%;
      background: rgba(15, 27, 51, 0.14);
      filter: blur(6px);
      animation: shadowPulse 5s ease-in-out infinite;
    }
    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
      display: block;
      color: transparent;
      font-size: 0;
      background: radial-gradient(circle at 35% 30%, #fff 0%, var(--pink) 45%, var(--pink-deep) 100%);
      box-shadow: inset 0 -6px 14px rgba(15, 27, 51, 0.12);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 50% { translate: 0 -8px; } }
    @keyframes shadowPulse { 50% { transform: scaleX(0.8); opacity: 0.6; } }

    h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-shadow:
        0 1px 0 #fff,
        0 2px 0 rgba(245, 195, 255, 0.9),
        0 3px 0 rgba(85, 173, 255, 0.55),
        0 10px 18px rgba(85, 173, 255, 0.35);
    }

    .role {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 16px;
      border-radius: 100px;
      background: linear-gradient(180deg, #ffffff, #f4f0ff);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--ink);
      box-shadow:
        inset 0 1px 0 #fff,
        0 3px 0 var(--pink),
        0 8px 16px -6px rgba(85, 173, 255, 0.45);
    }

    .divider {
      width: 48px;
      height: 5px;
      border-radius: 5px;
      margin: 20px auto 16px;
      background: linear-gradient(90deg, var(--blue), var(--pink));
      box-shadow: 0 3px 8px rgba(85, 173, 255, 0.4);
    }

    .bio {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.8;
      color: var(--ink);
    }
    .bio .star {
      display: inline-block;
      color: var(--blue);
      text-shadow: 0 2px 4px rgba(85, 173, 255, 0.5);
      animation: twirl 3.2s ease-in-out infinite;
    }
    @keyframes twirl {
      0%, 100% { transform: rotate(0) scale(1); }
      50% { transform: rotate(180deg) scale(1.25); }
    }

    .email {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 8px 16px;
      border: 0;
      border-radius: 100px;
      background: linear-gradient(180deg, #fff, #fdf3ff);
      font: inherit;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
      box-shadow: inset 0 1px 0 #fff, 0 3px 0 var(--pink-deep), 0 8px 14px -6px rgba(220, 154, 236, 0.8);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .email:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 #fff, 0 4px 0 var(--pink-deep), 0 12px 18px -6px rgba(220, 154, 236, 0.9); }
    .email:active { transform: translateY(3px); box-shadow: inset 0 1px 0 #fff, 0 0 0 var(--pink-deep), 0 4px 8px -4px rgba(220, 154, 236, 0.8); }

    /* ================= 3D buttons ================= */
    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 28px;
    }
    .links li {
      opacity: 0;
      transform: translateY(18px) rotateX(-40deg);
      transform-origin: 50% 100%;
      animation: rise 0.7s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: calc(0.25s + var(--i) * 0.08s);
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .btn {
      --face: #ffffff;
      --face2: #fbf7ff;
      --edge: var(--pink);
      --glow: rgba(220, 154, 236, 0.55);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      min-height: 56px;
      padding: 12px 22px;
      border-radius: 100px;
      background: linear-gradient(180deg, var(--face), var(--face2));
      color: var(--ink);
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      isolation: isolate;
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 -2px 0 rgba(15, 27, 51, 0.04),
        0 5px 0 var(--edge),
        0 14px 22px -10px var(--glow);
      transition: transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    /* glossy shine sweep */
    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      left: -60%;
      z-index: -1;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.85), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s cubic-bezier(.2,.8,.2,1);
    }
    /* top gloss */
    .btn::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 4px;
      height: 40%;
      border-radius: 100px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), transparent);
      pointer-events: none;
      z-index: -1;
    }
    .btn:hover, .btn:focus-visible {
      outline: none;
      transform: translateY(-3px);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 -2px 0 rgba(15, 27, 51, 0.04),
        0 8px 0 var(--edge),
        0 22px 28px -12px var(--glow);
    }
    .btn:hover::before, .btn:focus-visible::before { left: 120%; }
    .btn:active {
      transform: translateY(5px);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 3px 8px rgba(15, 27, 51, 0.08),
        0 0 0 var(--edge),
        0 4px 8px -4px var(--glow);
    }

    .btn small {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--ink-soft);
    }

    .btn.primary {
      --face: #7cc0ff;
      --face2: var(--blue);
      --edge: var(--blue-deep);
      --glow: rgba(47, 138, 230, 0.6);
    }
    .btn.primary small { color: var(--ink); opacity: 0.8; }
    .btn.accent {
      --face: #fbdcff;
      --face2: var(--pink);
      --edge: var(--pink-deep);
      --glow: rgba(220, 154, 236, 0.75);
    }

    .footer {
      margin-top: 28px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
    }
    .footer .heart {
      display: inline-block;
      color: var(--blue);
      text-shadow: 0 2px 4px rgba(85, 173, 255, 0.5);
      animation: beat 1.6s ease-in-out infinite;
    }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      padding: 10px 18px;
      border-radius: 100px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 10px 24px -8px rgba(15, 27, 51, 0.5);
      transition: opacity 0.3s, transform 0.3s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 420px) {
      .o1 { width: 84px; height: 84px; }
      .o3 { width: 120px; height: 120px; }
      .ring { width: 100px; height: 100px; border-width: 12px; left: 68%;
        -webkit-mask: radial-gradient(circle, transparent 37px, #000 38px);
                mask: radial-gradient(circle, transparent 37px, #000 38px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .links li { opacity: 1; transform: none; }
      .card { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="orb blue o1" data-depth="0.6"></div>
    <div class="orb pink o2" data-depth="1"></div>
    <div class="orb pink o3" data-depth="0.4"></div>
    <div class="orb blue o4" data-depth="0.8"></div>
    <div class="orb blue o5" data-depth="1.2"></div>
    <div class="orb pink o6" data-depth="1.1"></div>
    <div class="ring"></div>
  </div>

  <div class="stage">
    <main class="card idle" id="card">
      <div class="layer z3">
        <div class="avatar-wrap">
          <img class="avatar"
               src="https://wengae.wordpress.com/wp-content/uploads/2023/08/4096-pfp-original-colored-background-1.png?w=300"
               alt="weng.ae 頭像" width="116" height="116">
        </div>
      </div>

      <div class="layer z2">
        <h1>weng.ae</h1>
        <p class="role">Blender MMD Animator &amp; AE Editor</p>
      </div>

      <div class="layer z1">
        <div class="divider"></div>
        <p class="bio"><span class="star">✦</span> Inquiries 中文 / English OK</p>
        <button class="email" type="button" data-email="weng.ae0@gmail.com" aria-label="複製 email weng.ae0@gmail.com">
          📩 weng.ae0@gmail.com
        </button>
      </div>

      <ul class="links layer z2">
        <li style="--i:0"><a class="btn primary" href="https://discord.gg/eZ4nu9p7uf" target="_blank" rel="noopener">My Discord Server<small>MMD method &amp; clips here</small></a></li>
        <li style="--i:1"><a class="btn" href="https://www.tiktok.com/@weng.ae" target="_blank" rel="noopener">TikTok</a></li>
        <li style="--i:2"><a class="btn" href="https://www.instagram.com/weng.ae/" target="_blank" rel="noopener">Instagram</a></li>
        <li style="--i:3"><a class="btn" href="https://www.youtube.com/@weng_ae" target="_blank" rel="noopener">YouTube</a></li>
        <li style="--i:4"><a class="btn" href="https://www.xiaohongshu.com/user/profile/678a5896000000000a03c1b5?xsec_token=YBOfYJW9eGZq3EeUHEMXmOVinDvXA7-aT3nq_WoQU8aes%3D&amp;xsec_source=app_share&amp;xhsshare=CopyLink&amp;appuid=678a5896000000000a03c1b5&amp;apptime=1737261810&amp;share_id=fcdfd63a57bb416c96ebe9c9e3688378&amp;fbclid=IwY2xjawH5YndleHRuA2FlbQIxMAABHbKSFvpmj3icfEUgRgMRoQpXpdh6coWYeoYbcs4CxeJiqBeHSXmw4d7nAA_aem_VBD0kKJmUGlRMHdP262HaA" target="_blank" rel="noopener">Rednote</a></li>
        <li style="--i:5"><a class="btn" href="https://www.threads.net/@weng.ae" target="_blank" rel="noopener">Threads</a></li>
        <li style="--i:6"><a class="btn accent" href="https://payhip.com/b/w0QFc" target="_blank" rel="noopener">My Shop<small>Anime CC + project files (soon)</small></a></li>
      </ul>

      <p class="footer layer z1">Thanks for checking out my bio~ <span class="heart">♡</span></p>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已複製 email ✦</div>

  <script>
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var card = document.getElementById('card');
      var orbs = Array.prototype.slice.call(document.querySelectorAll('.orb'));
      if (reduce) return;

      var tx = 0, ty = 0, cx = 0, cy = 0, active = false, idleTimer;

      function setTarget(x, y) {
        tx = Math.max(-1, Math.min(1, x));
        ty = Math.max(-1, Math.min(1, y));
        if (!active) {
          active = true;
          card.classList.remove('idle');
        }
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          active = false;
          tx = ty = 0;
          card.classList.add('idle');
        }, 4000);
      }

      // Desktop: mouse
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        setTarget((e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2);
      });

      // Phones: gyroscope where allowed without a prompt (Android); iOS asks once on first tap
      function onOrient(e) {
        if (e.gamma == null) return;
        setTarget(e.gamma / 25, (e.beta - 45) / 25);
      }
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          document.addEventListener('click', function ask() {
            document.removeEventListener('click', ask);
            DeviceOrientationEvent.requestPermission().then(function (s) {
              if (s === 'granted') window.addEventListener('deviceorientation', onOrient);
            }).catch(function () {});
          });
        } else {
          window.addEventListener('deviceorientation', onOrient);
        }
      }

      function loop() {
        cx += (tx - cx) * 0.08;
        cy += (ty - cy) * 0.08;
        if (active) {
          card.style.setProperty('--ry', (cx * 9).toFixed(2) + 'deg');
          card.style.setProperty('--rx', (-cy * 9).toFixed(2) + 'deg');
          card.style.setProperty('--gx', (50 + cx * 40).toFixed(1) + '%');
          card.style.setProperty('--gy', (cy * 40).toFixed(1) + '%');
        }
        for (var i = 0; i < orbs.length; i++) {
          var d = parseFloat(orbs[i].getAttribute('data-depth')) || 1;
          orbs[i].style.setProperty('--px', (-cx * 26 * d).toFixed(1) + 'px');
          orbs[i].style.setProperty('--py', (-cy * 26 * d).toFixed(1) + 'px');
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();

    // Copy email
    (function () {
      var btn = document.querySelector('.email');
      var toast = document.getElementById('toast');
      var timer;
      function show(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }
      btn.addEventListener('click', function () {
        var email = btn.getAttribute('data-email');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(email).then(function () { show('已複製 email ✦'); },
            function () { window.location.href = 'mailto:' + email; });
        } else {
          window.location.href = 'mailto:' + email;
        }
      });
    })();
  </script>
</body>
</html>
